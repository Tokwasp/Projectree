spring:
  application:
    name: projectree
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  # 레디스
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  session:
    store-type: redis
    timeout: 30m

#CORS
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  session:
    cookie:
      secure: ${SESSION_COOKIE_SECURE}
      same-site: ${SESSION_COOKIE_SAME_SITE}

# 구글 Oauth
google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  token-uri: https://oauth2.googleapis.com/token
  userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo

# 네이버 Oauth
naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  token-uri: https://nid.naver.com/oauth2.0/token
  userinfo-uri: https://openapi.naver.com/v1/nid/me
