spring:
  application:
    name: projectree
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
    # data.sql을 Hibernate DDL 이후에 실행 (기본값 false면 테이블 생성 전에 실행되어 실패)
    defer-datasource-initialization: true

  # data.sql은 기본적으로 내장 DB에서만 실행되므로 MySQL에서도 실행되도록 always 로 지정
  sql:
    init:
      mode: always


  data:
    web:
      pageable:
        max-page-size: 50
    # 레디스
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  session:
    store-type: redis
    timeout: 30m
  # AWS
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION:ap-northeast-2}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

#CORS
app:
  invitation:
    base-url: ${INVITATION_BASE_URL}
  invitation-mail:
    scheduling-enabled: true
  meeting-sync:
    enabled: ${MEETING_SYNC_ENABLED:true}
    fixed-delay-ms: ${MEETING_SYNC_FIXED_DELAY_MS:5000}
    scan-count: ${MEETING_SYNC_SCAN_COUNT:200}
    key-prefix: ${MEETING_SYNC_KEY_PREFIX:meeting:project:}
  meeting-analysis:
    graph-snapshot:
      max-size-bytes: ${MEETING_ANALYSIS_GRAPH_SNAPSHOT_MAX_SIZE_BYTES:10485760}
      s3:
        enabled: ${MEETING_ANALYSIS_GRAPH_SNAPSHOT_S3_ENABLED:false}
        expected-bucket: ${AWS_ANALYSIS_RESULT_BUCKET:}
        allowed-object-key-prefix: ${MEETING_ANALYSIS_GRAPH_SNAPSHOT_S3_PREFIX:graph-snapshots/}
        region: ${AWS_REGION:ap-northeast-2}
        endpoint-override: ${MEETING_ANALYSIS_GRAPH_SNAPSHOT_S3_ENDPOINT:}
    publisher:
      enabled: ${MEETING_ANALYSIS_PUBLISHER_ENABLED:false}
      fixed-delay-ms: ${MEETING_ANALYSIS_PUBLISHER_FIXED_DELAY_MS:1000}
      batch-size: ${MEETING_ANALYSIS_PUBLISHER_BATCH_SIZE:20}
      max-attempts: ${MEETING_ANALYSIS_PUBLISHER_MAX_ATTEMPTS:3}
      lease-duration-seconds: ${MEETING_ANALYSIS_PUBLISHER_LEASE_SECONDS:60}
      first-retry-delay-seconds: ${MEETING_ANALYSIS_FIRST_RETRY_DELAY_SECONDS:30}
      second-retry-delay-seconds: ${MEETING_ANALYSIS_SECOND_RETRY_DELAY_SECONDS:120}
      api-call-attempt-timeout-seconds: ${MEETING_ANALYSIS_API_CALL_ATTEMPT_TIMEOUT_SECONDS:5}
      api-call-timeout-seconds: ${MEETING_ANALYSIS_API_CALL_TIMEOUT_SECONDS:10}
      queue-url: ${MEETING_ANALYSIS_COMMAND_QUEUE_URL:}
      region: ${AWS_REGION:ap-northeast-2}
    result-consumer:
      enabled: ${MEETING_ANALYSIS_RESULT_CONSUMER_ENABLED:false}
      queue-url: ${AWS_ANALYSIS_RESULT_QUEUE_URL:}
      wait-time-seconds: ${MEETING_ANALYSIS_RESULT_WAIT_TIME_SECONDS:20}
      max-number-of-messages: ${MEETING_ANALYSIS_RESULT_MAX_NUMBER_OF_MESSAGES:10}
      polling-delay-ms: ${MEETING_ANALYSIS_RESULT_POLLING_DELAY_MS:1000}
      region: ${AWS_REGION:ap-northeast-2}
  meeting-record:
    callback:
      # Python 분석 서버와 공유하는 비밀. 비어 있으면 Callback 인증은 항상 실패한다.
      api-key: ${MEETING_RECORD_CALLBACK_API_KEY:}
  # 초대 메일 스위퍼와 알림 하트비트가 함께 이 스위치를 쓴다.
  scheduling:
    enabled: true
  notification:
    sse:
      # 세션 타임아웃과 맞춘다. 브라우저가 자동 재연결하므로 죽은 연결을 청소하는 주기에 가깝다.
      timeout: 30m
      # ALB idle timeout(60초)의 절반.
      heartbeat-interval: 30s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  session:
    cookie:
      secure: ${SESSION_COOKIE_SECURE}
      same-site: ${SESSION_COOKIE_SAME_SITE}
  s3:
    bucket: ${AWS_S3_BUCKET}
    # presigned URL 유효 시간. 업로드 한 번에 필요한 만큼만 짧게 준다.
    presigned-url-expire-seconds: 300

# 구글 Oauth
google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  token-uri: https://oauth2.googleapis.com/token
  userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo

# 네이버 Oauth
naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  token-uri: https://nid.naver.com/oauth2.0/token
  userinfo-uri: https://openapi.naver.com/v1/nid/me
