spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  #JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
    open-in-view: false

  # Session Mock
  session:
    store-type: none
  # AWS — 실제 호출은 하지 않지만 S3Client 빈 생성에 자격증명·리전이 필요하다.
  cloud:
    aws:
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      region:
        static: ap-northeast-2
  mail:
    host: localhost
    port: 2525
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ssl:
        enabled: false

# CORS
app:
  invitation:
    base-url: https://projectree.site
  # 통합 테스트 중 백그라운드 스케줄러가 테스트 데이터를 건드리지 않도록 비활성화한다.
  scheduling:
    enabled: false
  notification:
    sse:
      timeout: 30m
      heartbeat-interval: 30s
  cors:
    allowed-origins: http://localhost:5173
  session:
    cookie:
      secure: false
      same-site: Lax
  s3:
    bucket: test-bucket
    presigned-url-expire-seconds: 300

# Google Oauth
google:
  client-id: test-client-id
  client-secret: test-client-secret
  token-uri: https://oauth2.googleapis.com/token
  userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo

# Naver Oauth
naver:
  client-id: test-client-id
  client-secret: test-client-secret
  token-uri: https://nid.naver.com/oauth2.0/token
  userinfo-uri: https://openapi.naver.com/v1/nid/me
