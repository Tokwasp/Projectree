# 프로젝트명 고정 — 디렉터리명이 바뀌어도 컨테이너/볼륨/네트워크 이름이 갈리지 않도록
name: projectree

services:
  mysql:
    image: mysql:8.0
    container_name: projectree-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 로 TCP 확인 (localhost는 유닉스 소켓이라 초기화 중에도 통과함)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectree-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 컨테이너 내부에서는 DB 호스트가 mysql 서비스명 (.env의 localhost를 오버라이드)
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "8080:8080"

volumes:
  mysql-data:
