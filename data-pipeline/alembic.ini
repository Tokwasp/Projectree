# alembic 설정. 실제 DB URL 은 env.py 가 data_pipeline.config(환경변수)에서 읽는다.
# 정본 = PostgreSQL. 테스트는 DATABASE_URL=sqlite:///... 로도 upgrade head 가능.
[alembic]
script_location = data_pipeline/storage/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
