[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-pipeline"
version = "0.1.0"
description = "노드 생성 파이프라인 (토폴로지 A: 그래프 정본 = 이 파이썬 PG). M1: contracts + storage + validation + 가짜 JSON E2E."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# M2 부터 LLM(①②) 호출. 오프라인 테스트는 llm 없이도 돈다(어댑터 lazy import).
llm = ["openai>=1.40", "python-dotenv>=1.0"]
dev = ["pytest>=8.0", "openai>=1.40", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_pipeline*"]

[tool.setuptools.package-data]
data_pipeline = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
