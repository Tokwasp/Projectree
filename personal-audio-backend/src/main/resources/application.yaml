spring:
  application:
    name: personal-audio-backend
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  cloud:
    aws:
      region:
        static: ap-northeast-2
      sqs:
        enabled: ${AWS_SQS_ENABLED:false}
        listener:
          max-concurrent-messages: ${SQS_MAX_CONCURRENT_MESSAGES:3}
          poll-timeout: 20s

logging:
  level:
    io.awspring.cloud.sqs.listener.sink.AbstractMessageProcessingPipelineSink: off

app:
  sqs:
    queue-name: ${SQS_QUEUE_NAME:MyOpenViduQueue-Personal}
  s3:
    bucket: ${S3_BUCKET}
  audio:
    silence-threshold: ${AUDIO_SILENCE_THRESHOLD:-30dB}
    min-silence-duration: ${AUDIO_MIN_SILENCE_DURATION:500ms}
    analyze-timeout: ${AUDIO_ANALYZE_TIMEOUT:2m}
  ai:
    gms:
      base-url: ${GMS_BASE_URL:}
      api-key: ${GMS_API_KEY:}
      model: ${GMS_MODEL:gpt-5.4-mini}
      transcribe-model: ${GMS_TRANSCRIBE_MODEL:whisper-1}
      max-upload-bytes: ${GMS_MAX_UPLOAD_BYTES:24000000}
      timeout: ${GMS_TIMEOUT:300s}
    audio:
      max-seconds: ${AI_AUDIO_MAX_SECONDS:1200}
      convert-timeout: ${AI_AUDIO_CONVERT_TIMEOUT:5m}

server:
  port: ${SERVER_PORT:8080}
